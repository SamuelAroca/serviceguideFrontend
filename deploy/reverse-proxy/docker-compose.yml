# Corre este compose en el mismo host que ServiceGuideFront, ServiceGuideBack
# y ServiceGuidePostgres. Se conecta a la red del stack de Postgres (donde
# ya esta el backend) para poder resolver los otros contenedores por nombre.
# Ver deploy/reverse-proxy/README.md para el paso a paso completo.
services:
  caddy:
    image: caddy:2-alpine
    container_name: ServiceGuideProxy
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - serviceguide-postgres_default

networks:
  serviceguide-postgres_default:
    external: true

volumes:
  caddy_data:
  caddy_config:
