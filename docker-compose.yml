services:
  frontend:
    container_name: ServiceGuideFront
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 5002:5002
    # Misma red que backend/postgres/proxy (ver deploy/reverse-proxy) para
    # que Caddy pueda resolver este contenedor por nombre.
    networks:
      - serviceguide-postgres_default

networks:
  serviceguide-postgres_default:
    external: true
